name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Types are up to date
        run: npm run types:check
      - name: Docs are up to date
        run: npm run docs:check
      - name: Examples validate from the command line
        run: node dist/cli.js examples/*/valid-*.json
      - name: Package contents
        run: npm pack --dry-run
