version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    # @types/node follows the oldest Node version in "engines": a newer major would type-check code that calls APIs
    # those versions don't have. Raise it by hand when the supported range moves.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports typescript < 6.1.0, so a TypeScript major breaks npm ci. Lift this once
      # typescript-eslint's peer range includes the new major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
