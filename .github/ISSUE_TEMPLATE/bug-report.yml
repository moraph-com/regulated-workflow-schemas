name: Report a bug
description: The validator, the command line, the types or the docs do something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste real records, even redacted ones. Reduce the problem to a small fictional record.
        For security issues, use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got. Include the full error output.
    validations:
      required: true
  - type: textarea
    id: record
    attributes:
      label: A fictional record that shows it
      render: json
  - type: input
    id: version
    attributes:
      label: Package version or commit
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: For example Node.js 22.11 on Windows, or a Cloudflare Worker.
